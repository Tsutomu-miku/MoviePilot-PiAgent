name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check plugins.v2 tests scripts && ruff format --check plugins.v2 tests scripts
      - run: python -m unittest discover -s tests/python -v
      - run: npm run package:plugin
      - run: python tests/runtime_process.py work/plugin-release/stage
